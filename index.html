<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Birthday Wish</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <div class="hero">
      <div class="hero-text">
        <p class="eyebrow">Happy 19th, Tithi lol 🎉</p>
        <h1>Happy birthday Tithi lol 🎉</h1>
        <p class="subtitle">A floating bouquet with soft fireworks and a clean note composer.</p>

        <div class="countdown-card">
          <p class="countdown-label">August 14 countdown</p>
          <p class="countdown-value" id="countdownText">Loading...</p>
        </div>
      </div>

      <div class="hero-art">
        <div class="bouquet">
          <div class="stem"></div>
          <div class="flower flower-1"></div>
          <div class="flower flower-2"></div>
          <div class="flower flower-3"></div>
          <div class="flower flower-4"></div>
        </div>
        <div class="firework firework-1"></div>
        <div class="firework firework-2"></div>
        <div class="firework firework-3"></div>
      </div>
    </div>

    <main class="card">
      <section class="message-panel">
        <p class="panel-title">Birthday messages</p>
        <p class="panel-copy">Add your note below and the page will stay focused on what matters most.</p>

        <label class="message-label" for="messageInput">Add message</label>
        <textarea id="messageInput" placeholder="Write your message here..." rows="4"></textarea>

        <button id="addMessageButton" class="action-button" disabled>Add message</button>

        <div class="message-list" id="messageList"></div>
      </section>

      <section class="music-panel">
        <p class="panel-title">Soothing music</p>
        <iframe class="music-frame" width="100%" height="220" src="https://www.youtube.com/embed/2OEL4P1Rz04?controls=1&rel=0" title="Soothing birthday music" frameborder="0" allow="autoplay; encrypted-media; clipboard-write; fullscreen" allowfullscreen></iframe>
  <script src="script.js"></script>
</body>
</html>
